{% extends "base.html" %}
{% block title %}Edit Transaction - Expense Tracker{% endblock %}
{% block content %}

<div class="glass-card rounded-2xl p-5 max-w-md">
    <h2 class="font-bold text-lg mb-4">Edit transaction</h2>
    <form method="post" class="space-y-4">
        <div>
            <label class="block mb-1.5 text-xs font-semibold uppercase tracking-wider text-muted">Type</label>
            <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center justify-center gap-2 input rounded-xl py-2.5 cursor-pointer has-[:checked]:border-indigo-400">
                    <input type="radio" name="type" value="expense" {{ 'checked' if txn.type == 'expense' }} class="accent-indigo-500"> Expense
                </label>
                <label class="flex items-center justify-center gap-2 input rounded-xl py-2.5 cursor-pointer has-[:checked]:border-indigo-400">
                    <input type="radio" name="type" value="income" {{ 'checked' if txn.type == 'income' }} class="accent-indigo-500"> Income
                </label>
            </div>
        </div>

        <div>
            <label class="block mb-1.5 text-xs font-semibold uppercase tracking-wider text-muted">Amount</label>
            <input type="number" step="0.01" min="0" name="amount" required value="{{ txn.amount }}"
                   class="input w-full py-2.5 px-3 rounded-xl">
        </div>

        <div>
            <label class="block mb-1.5 text-xs font-semibold uppercase tracking-wider text-muted">Category</label>
            <select name="category_id" class="input w-full py-2.5 px-3 rounded-xl">
                {% for c in categories %}
                <option value="{{ c.id }}" {{ 'selected' if c.id == txn.category_id }}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block mb-1.5 text-xs font-semibold uppercase tracking-wider text-muted">Date</label>
            <!-- Custom picker (script.js), not native <input type="date">
                 - see the comment above initDatePicker() in script.js for
                 why. -->
            <div class="relative" data-datepicker>
                <button type="button" data-dp-trigger
                        class="input w-full py-2.5 px-3 rounded-xl text-left flex items-center justify-between gap-2">
                    <span data-dp-display></span>
                    <span class="text-muted">📅</span>
                </button>
                <!-- type="text" + .hidden, not type="hidden" - see the
                     comment on this same input in transactions.html for why. -->
                <input type="text" class="hidden" name="date" required data-dp-value value="{{ txn.date }}">
                <!-- top-full + left-0 (not just a margin) - relying on the
                     browser's default "static position" fallback for an
                     absolutely positioned element with no inset properties
                     set at all is fragile and can shift depending on
                     content/viewport. max-w clamps it on very narrow
                     screens so it can never overflow past the edge. -->
                <div data-dp-panel class="hidden absolute top-full left-0 z-20 mt-2 rounded-xl p-3 w-64 max-w-[calc(100vw-2rem)]"></div>
            </div>
        </div>

        <div>
            <label class="block mb-1.5 text-xs font-semibold uppercase tracking-wider text-muted">Note (optional)</label>
            <input type="text" name="note" value="{{ txn.note or '' }}" class="input w-full py-2.5 px-3 rounded-xl">
        </div>

        <div class="flex gap-2">
            <button type="submit" class="action-btn flex-1 bg-indigo-500 hover:bg-indigo-400 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-500/20">
                Save
            </button>
        </div>
    </form>

    <form method="post" action="{{ url_for('delete_transaction', txn_id=txn.id) }}" class="mt-2"
          onsubmit="return confirm('Delete this transaction?')">
        <button type="submit" class="action-btn w-full bg-white/10 hover:bg-rose-500/20 text-rose-400 font-semibold py-2.5 rounded-xl">
            Delete
        </button>
    </form>
</div>

{% endblock %}

{% extends "expenses/base.html" %}
{% load i18n %}
{% block title %}{% translate "Edit Transaction" %} - Expense Tracker{% endblock %}
{% block content %}

<div class="glass-card rounded-2xl p-5 max-w-md">
    <h2 class="font-bold text-lg mb-4">{% translate "Edit transaction" %}</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block mb-1.5 text-xs font-semibold uppercase tracking-wider text-muted">{% translate "Type" %}</label>
            <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center justify-center gap-2 input rounded-xl py-2.5 cursor-pointer has-[:checked]:border-indigo-400">
                    <input type="radio" name="type" value="expense" {% if txn.type == 'expense' %}checked{% endif %} class="accent-indigo-500"> {% translate "Expense" %}
                </label>
                <label class="flex items-center justify-center gap-2 input rounded-xl py-2.5 cursor-pointer has-[:checked]:border-indigo-400">
                    <input type="radio" name="type" value="income" {% if txn.type == 'income' %}checked{% endif %} class="accent-indigo-500"> {% translate "Income" %}
                </label>
            </div>
        </div>

        <div>
            <label class="block mb-1.5 text-xs font-semibold uppercase tracking-wider text-muted">{% translate "Amount" %}</label>
            <input type="number" step="0.01" min="0" name="amount" required value="{{ txn.amount }}"
                   class="input w-full py-2.5 px-3 rounded-xl">
        </div>

        <div>
            <label class="block mb-1.5 text-xs font-semibold uppercase tracking-wider text-muted">{% translate "Category" %}</label>
            <select name="category_id" class="input w-full py-2.5 px-3 rounded-xl">
                {% for c in categories %}
                <option value="{{ c.id }}" {% if c.id == txn.category_id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block mb-1.5 text-xs font-semibold uppercase tracking-wider text-muted">{% translate "Date" %}</label>
            <input type="date" name="date" value="{{ txn.date|date:'Y-m-d' }}" required class="input w-full py-2.5 px-3 rounded-xl">
        </div>

        <div>
            <label class="block mb-1.5 text-xs font-semibold uppercase tracking-wider text-muted">{% translate "Note (optional)" %}</label>
            <input type="text" name="note" value="{{ txn.note|default:'' }}" class="input w-full py-2.5 px-3 rounded-xl">
        </div>

        <div class="flex gap-2">
            <button type="submit" class="action-btn flex-1 bg-indigo-500 hover:bg-indigo-400 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-500/20">
                {% translate "Save" %}
            </button>
        </div>
    </form>

    <form method="post" action="{% url 'delete_transaction' pk=txn.id %}" class="mt-2"
          onsubmit="return confirm('{% translate "Delete this transaction?" %}')">
        {% csrf_token %}
        <button type="submit" class="action-btn w-full bg-white/10 hover:bg-rose-500/20 text-rose-400 font-semibold py-2.5 rounded-xl">
            {% translate "Delete" %}
        </button>
    </form>
</div>

{% endblock %}

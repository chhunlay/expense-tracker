{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'expenses/style.css' %}">
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

<div class="w-full max-w-sm">
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-pink-500 shadow-lg shadow-indigo-500/20 mb-3">
            <span class="text-2xl">💰</span>
        </div>
        <h1 class="text-xl font-extrabold tracking-tight">Expense Tracker</h1>
    </div>

    {% if messages %}
        <div class="mb-4 space-y-2">
            {% for message in messages %}
                <div class="flash glass-card rounded-xl px-4 py-2.5 text-sm font-medium {% if message.tags == 'error' %}text-neg{% else %}text-pos{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}{% endblock %}
</div>

<script src="{% static 'expenses/script.js' %}"></script>
</body>
</html>

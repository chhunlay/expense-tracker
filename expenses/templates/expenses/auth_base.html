{% load static %}
<!DOCTYPE html>
<html lang="en" class="auth-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'expenses/style.css' %}?v={{ app_version }}">
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

<div class="w-full max-w-sm">
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl border border-white/15 mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                 class="text-main" aria-hidden="true">
                <path d="M3 7a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v1h1a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <path d="M16 12h2"/>
            </svg>
        </div>
        <h1 class="text-xl font-extrabold tracking-tight">Expense Tracker</h1>
    </div>

    {% if messages %}
        <div class="mb-4 space-y-2">
            {% for message in messages %}
                <div class="flash glass-card rounded-xl px-4 py-2.5 text-sm font-medium {% if message.tags == 'error' %}text-neg{% else %}text-pos{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}{% endblock %}
</div>

<script src="{% static 'expenses/script.js' %}?v={{ app_version }}"></script>
</body>
</html>
